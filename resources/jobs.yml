# Two serverless jobs, both running entry points from the project wheel.
#
# retail_etl          setup -> generate -> bronze -> silver -> gold -> quality_gate
# retail_agent_eval   golden-question eval of the agent against real gold tables

resources:
  jobs:
    retail_etl:
      name: retail-etl-${bundle.target}
      description: Medallion ETL for the retail insights project (raw CSV -> bronze -> silver -> gold).
      max_concurrent_runs: 1
      tags:
        project: retail-insights
        layer: etl

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/New_York
        pause_status: ${var.etl_schedule_status}

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: days
          default: ${var.etl_days}

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: setup
          environment_key: default
          python_wheel_task:
            package_name: retail_insights
            entry_point: retail-setup
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}"]

        - task_key: generate
          depends_on: [{ task_key: setup }]
          environment_key: default
          python_wheel_task:
            package_name: retail_insights
            entry_point: retail-generate
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}",
                         "--days", "{{job.parameters.days}}"]

        - task_key: bronze
          depends_on: [{ task_key: generate }]
          environment_key: default
          python_wheel_task:
            package_name: retail_insights
            entry_point: retail-bronze
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}"]

        - task_key: silver
          depends_on: [{ task_key: bronze }]
          environment_key: default
          python_wheel_task:
            package_name: retail_insights
            entry_point: retail-silver
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}"]

        - task_key: gold
          depends_on: [{ task_key: silver }]
          environment_key: default
          python_wheel_task:
            package_name: retail_insights
            entry_point: retail-gold
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}"]

        - task_key: quality_gate
          depends_on: [{ task_key: gold }]
          environment_key: default
          python_wheel_task:
            package_name: retail_insights
            entry_point: retail-quality-gate
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--schema", "{{job.parameters.schema}}",
                         "--max-quarantine-rate", "0.05", "--run-id", "{{job.run_id}}"]

    retail_agent_eval:
      name: retail-agent-eval-${bundle.target}
      description: Scores the agent on golden questions against live gold tables and the real model.
      max_concurrent_runs: 1
      tags:
        project: retail-insights
        layer: ai

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: eval
          environment_key: default
          python_wheel_task:
            package_name: retail_insights
            entry_point: retail-eval
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}",
                         "--warehouse-id", "${var.warehouse_id}", "--endpoint", "${var.llm_endpoint}",
                         "--min-pass-rate", "0.75"]

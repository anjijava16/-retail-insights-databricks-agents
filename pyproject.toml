[project]
name = "retail-insights"
version = "0.1.0"
description = "Retail medallion ETL plus a tool-calling insights agent, deployed to Databricks with Asset Bundles."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Anjaiah Methuku" }]
license = { text = "MIT" }

# Runtime deps for the wheel that runs on Databricks serverless jobs.
# pyspark is deliberately NOT listed: the Databricks runtime provides it.
dependencies = [
    "databricks-sdk>=0.40.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "sqlglot>=25.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.38.0"]

# Each script below is also a python_wheel_task entry point in resources/jobs.yml.
[project.scripts]
retail-setup = "retail_insights.etl.jobs:setup"
retail-generate = "retail_insights.etl.jobs:generate"
retail-bronze = "retail_insights.etl.jobs:bronze"
retail-silver = "retail_insights.etl.jobs:silver"
retail-gold = "retail_insights.etl.jobs:gold"
retail-quality-gate = "retail_insights.etl.jobs:quality_gate"
retail-eval = "retail_insights.evals.runner:main"
retail-grant-app = "retail_insights.ops.grants:main"

[dependency-groups]
dev = [
    "pyspark>=4.0.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.6.0",
    "streamlit>=1.38.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_insights"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["spark: needs a local SparkSession (Java required)"]
